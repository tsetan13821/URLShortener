# On every push and pull request: the full test suite against real PostgreSQL and Redis, and a
# build + smoke test of the Docker image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Same versions as local development. Credentials match src/main/resources/application.yml and
    # application-test.yml, so the tests need no CI-specific configuration.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: url_shortener
          POSTGRES_PASSWORD: url_shortener
          POSTGRES_DB: url_shortener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U url_shortener -d url_shortener_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -B -ntp test

      # On failure, keep the per-test reports and logs so the cause can be read from the run page.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # Builds the Docker image and starts the full stack from compose.yaml, then checks the
  # containerised app really works: healthy, creates a link, redirects it.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build and start app + PostgreSQL + Redis
        run: docker compose --profile full up -d --build --wait --wait-timeout 180
        env:
          CODE_SECRET: ci-smoke-test-code-secret

      - name: Smoke test
        run: |
          set -eu
          curl -fsS http://localhost:8080/actuator/health
          code=$(curl -fsS -H 'Content-Type: application/json' \
            -d '{"url":"https://github.com/tsetan13821/URLShortener"}' \
            http://localhost:8080/api/urls | jq -r .shortCode)
          echo "created $code"
          location=$(curl -sS -o /dev/null -w '%{redirect_url}' "http://localhost:8080/$code")
          test "$location" = "https://github.com/tsetan13821/URLShortener"
          curl -fsS -o /dev/null http://localhost:8080/

      - name: Container logs
        if: always()
        run: docker compose --profile full logs app
