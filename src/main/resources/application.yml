# Every value can be overridden with an environment variable (shown in ${VAR:default}),
# so the same artifact runs locally and in other environments without code changes.
# The defaults below are for local development only.

spring:
  application:
    name: url-shortener

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/url_shortener}
    username: ${DB_USERNAME:url_shortener}
    password: ${DB_PASSWORD:url_shortener}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  # Schema changes are versioned Flyway migrations in src/main/resources/db/migration, applied in
  # order at startup (each exactly once, recorded in the flyway_schema_history table).
  flyway:
    enabled: ${DB_MIGRATE:true}
    # Databases created before Flyway already hold the V1 schema: record them as version 1
    # instead of failing. Only applies to a non-empty schema without a history table; Hibernate's
    # `validate` below still catches a schema that doesn't actually match.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Existing schema before Flyway

  jpa:
    # Hibernate never changes the schema; it only checks the entities match the migrations.
    hibernate:
      ddl-auto: validate
    # Don't keep a DB connection open for the whole HTTP request.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Short timeouts: Redis is only an accelerator, so a slow/dead Redis must
      # fail fast and let the request fall back to PostgreSQL.
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:500ms}

  web:
    resources:
      cache:
        cachecontrol:
          # Web UI files: browsers may keep a copy but must check it's still current before using it
          # (a cheap 304 Not Modified when nothing changed), so an update is never served stale.
          no-cache: true

server:
  port: ${SERVER_PORT:8080}
  # Where the client IP (used for rate limiting) comes from. "none" = the TCP connection, which is
  # correct when clients connect directly. Behind a trusted reverse proxy / load balancer set
  # FORWARD_HEADERS_STRATEGY=native (or framework) so X-Forwarded-For is honoured. Never enable it
  # without such a proxy: clients could then fake their IP to dodge the limit.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

app:
  # Public base URL used to build short links, e.g. https://sho.rt
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cache:
    # How long a short-code -> URL mapping stays in Redis.
    ttl: ${CACHE_TTL:24h}
    key-prefix: ${CACHE_KEY_PREFIX:url:}
    # After a Redis failure, skip Redis for this long instead of paying a timeout on every request.
    failure-backoff: ${CACHE_FAILURE_BACKOFF:10s}
  clicks:
    # Redirects count clicks in this Redis hash; a background job writes them to PostgreSQL
    # in one batch every flush-interval (so redirects never write to the database).
    pending-key: ${CLICKS_PENDING_KEY:clicks:pending}
    flush-interval: ${CLICKS_FLUSH_INTERVAL:30s}
  rate-limit:
    # Caps link creation (POST /api/urls) per client IP; redirects and stats are never limited.
    # Over the limit: 429 Too Many Requests with Retry-After. If Redis is down, creation is allowed.
    enabled: ${RATE_LIMIT_ENABLED:true}
    create-limit: ${RATE_LIMIT_CREATE:20}
    window: ${RATE_LIMIT_WINDOW:1m}
    key-prefix: ${RATE_LIMIT_KEY_PREFIX:rl:create:}
